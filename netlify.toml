[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/dishes"
  to = "/api/dishes.json"
  status = 200

[[redirects]]
  from = "/api/restaurants"
  to = "/api/restaurants.json"
  status = 200

[[redirects]]
  from = "/api/plans"
  to = "/api/plans.json"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
